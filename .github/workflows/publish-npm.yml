name: Publish npm Package

on:
  push:
    tags:
      - "lark-openapi-mcp-v*"
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Git ref to publish from, defaults to the current branch/tag"
        required: false
        type: string
      expected_version:
        description: "Expected package version for manual publish or dry-run"
        required: false
        type: string
      dry_run:
        description: "Run build/test/pack checks without publishing"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    if: github.repository == 'ticoag/lark'
    uses: ./.github/workflows/lark-openapi-checks.yml
    with:
      checkout_ref: ${{ github.event.inputs.release_ref || github.ref }}
      node_version: "24"
      upload_package_artifact: true
      artifact_name: lark-openapi-mcp-package

  publish:
    if: github.repository == 'ticoag/lark'
    needs: checks
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    defaults:
      run:
        shell: bash
        working-directory: lark-openapi-mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Download publishable package artifact
        uses: actions/download-artifact@v4
        with:
          name: lark-openapi-mcp-package
          path: lark-openapi-mcp

      - name: Verify release version from tag
        if: github.event_name == 'push'
        run: python3 ../scripts/verify_npm_release.py --package package.json --tag "${GITHUB_REF_NAME}" --prefix "lark-openapi-mcp-v"

      - name: Verify expected version for manual run
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.expected_version != ''
        run: python3 ../scripts/verify_npm_release.py --package package.json --expected-version "${{ github.event.inputs.expected_version }}"

      - name: Publish dry run
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true'
        run: npm publish --dry-run --access public --ignore-scripts

      - name: Publish to npm
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true')
        run: npm publish --provenance --access public --ignore-scripts
