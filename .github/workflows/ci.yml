name: CI

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/lark-openapi-checks.yml"
      - ".github/workflows/publish-npm.yml"
      - "lark-openapi-mcp/src/**"
      - "lark-openapi-mcp/tests/**"
      - "lark-openapi-mcp/package.json"
      - "lark-openapi-mcp/package-lock.json"
      - "lark-openapi-mcp/tsconfig.json"
      - "lark-openapi-mcp/jest.config.js"
      - "scripts/taskctl.py"
      - "scripts/verify_npm_release.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/lark-openapi-checks.yml"
      - ".github/workflows/publish-npm.yml"
      - "lark-openapi-mcp/src/**"
      - "lark-openapi-mcp/tests/**"
      - "lark-openapi-mcp/package.json"
      - "lark-openapi-mcp/package-lock.json"
      - "lark-openapi-mcp/tsconfig.json"
      - "lark-openapi-mcp/jest.config.js"
      - "scripts/taskctl.py"
      - "scripts/verify_npm_release.py"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lark-openapi-mcp:
    uses: ./.github/workflows/lark-openapi-checks.yml
    with:
      node_version: "20"

  repo-guardrails:
    name: repo guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install yq
        run: sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 && sudo chmod +x /usr/local/bin/yq

      - name: Validate task docs
        run: python3 scripts/taskctl.py lint
